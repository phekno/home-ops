---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      # The secrets bundle is generated once and never regenerated: it holds the
      # cluster CAs, so a new one would orphan every existing node.
      - '[ -f talsecret.sops.yaml ] || talosctl gen secrets --force -o /dev/stdout | sops --filename-override talos/talsecret.sops.yaml --encrypt /dev/stdin > talsecret.sops.yaml'
      - task: :talos:generate-config
      # Nodes are in maintenance mode, so apply without TLS (--insecure).
      - for: { var: NODE_HOSTS }
        cmd: >-
          talosctl apply-config --insecure
          --nodes $(yq -N -r 'select(.kind == "LinkConfig") | .addresses[0].address | split("/") | .[0]' nodes/{{.ITEM}}.yaml)
          --file clusterconfig/{{.CLUSTER_NAME}}-{{.ITEM}}.yaml
      - until talosctl bootstrap --nodes {{.FIRST_NODE_IP}}; do sleep 10; done
      - until talosctl kubeconfig --nodes {{.FIRST_NODE_IP}} {{.ROOT_DIR}} --force; do sleep 10; done
    vars:
      NODE_HOSTS:
        sh: for f in {{.TALOS_DIR}}/nodes/*.yaml; do basename "$f" .yaml; done
      FIRST_NODE_IP:
        sh: yq -N -r 'select(.kind == "LinkConfig") | .addresses[0].address | split("/") | .[0]' {{.TALOS_DIR}}/nodes/*.yaml | head -n1
      CLUSTER_NAME:
        sh: yq -r '.clusterName' {{.TALOS_DIR}}/talenv.yaml
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talenv.yaml
      - ls {{.TALOS_DIR}}/nodes/*.yaml
      - which talosctl sops yq

  crds:
    desc: Apply CRDs that ship with charts, sourced from their Flux OCIRepository
    cmd: bash {{.SCRIPTS_DIR}}/apply-chart-crds.sh
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.SCRIPTS_DIR}}/apply-chart-crds.sh
      - which helm kubectl yq

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
