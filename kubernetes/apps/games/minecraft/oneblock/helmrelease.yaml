---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-oneblock
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  dependsOn: []
  interval: 15m
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/phekno/minecraft-oneblock
      # minecraft-bentobox tags each build <mc>-<short-sha>, which Renovate
      # can neither order nor match across builds, so it never offered one.
      # Track latest instead: the digest pin keeps Flux deterministic and
      # Renovate opens a digest PR each time latest moves.
      tag: latest@sha256:fc5370115ecd5066523ec1393e110874c94dc22a7da2240d2f2bbee77ca8fe91
    resources:
      requests:
        cpu: 500m
      limits:
        memory: 6Gi
    securityContext:
      runAsUser: 1000
      fsGroup: 100
    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 30
    startupProbe:
      enabled: true
    extraEnv:
      TZ: America/Chicago
    persistence:
      storageClass: longhorn
      dataDir:
        enabled: true
        Size: 10Gi
        existingClaim: minecraft-oneblock-datadir
    # The chart renders top-level serviceAnnotations onto the Minecraft service.
    # minecraftServer.serviceAnnotations is deprecated and silently ignored --
    # putting the Cilium annotation there is why survival ended up on a pool
    # address instead of its declared one.
    serviceAnnotations:
      io.cilium/lb-ipam-ips: 10.100.50.158
      # gatus-sidecar watches annotated Services, so the check lives here
      # rather than in a ConfigMap. playit reassigns the port whenever a
      # tunnel's region changes, so this value has to be updated by hand --
      # players follow the SRV record and are not affected.
      #
      # A TCP connect only proves playit's edge is accepting. mc-monitor is
      # the real health signal; this catches DNS and tunnel-shaped failures
      # that are invisible from inside the cluster.
      gatus.home-operations.com/enabled: "true"
      gatus.home-operations.com/endpoint: |-
        name: minecraft-oneblock-tunnel
        group: external
        url: "tcp://phekno-oneblock.playit.plus:30972"
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        ui:
          hide-hostname: true
    minecraftServer:
      eula: true
      # Required, not redundant. The chart always renders TYPE and VERSION as
      # explicit env vars (defaulting to VANILLA/LATEST), which override the
      # ENV baked into the image. Omit these and the server boots vanilla with
      # no BentoBox at all.
      type: PAPER
      # 26.2 is the newest release BentoBox 3.23.0 lists as tested. Keep this in
      # step with the image; bump both together.
      version: "26.2"
      overrideServerProperties: true
      jvmXXOpts: "-XX:MaxRAMPercentage=75"
      difficulty: normal
      spawnProtection: 0
      gameMode: survival
      pvp: false
      ops: "phekno,quinnyf13"
      whitelist: "phekno,quinnyf13,harpyf13,LivParrot,abbykinz2013"
      motd: "Phekno's OneBlock Server"
      viewDistance: 12
      modUrls: []
      rcon:
        enabled: true
      serviceType: LoadBalancer
  valuesFrom:
    - kind: Secret
      name: *app
      valuesKey: RCON_PASSWORD
      targetPath: minecraftServer.rcon.password
