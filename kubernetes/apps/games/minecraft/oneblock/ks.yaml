---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft-oneblock
  namespace: &namespace games
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  components:
    # Checks the playit tunnel, i.e. the address the kids actually type.
    - ../../../../components/gatus/tcp
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
  path: ./kubernetes/apps/games/minecraft/oneblock
  postBuild:
    substitute:
      APP: *app
      GATUS_TCP_GROUP: minecraft
      GATUS_TCP_ENDPOINT: phekno-oneblock.playit.plus:55754
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
