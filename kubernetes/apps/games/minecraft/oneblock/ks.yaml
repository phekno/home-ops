---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft-oneblock
  namespace: &namespace games
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  components: []
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
  path: ./kubernetes/apps/games/minecraft/oneblock
  postBuild:
    substitute:
      APP: *app
      GATUS_TCP_GROUP: minecraft
      # playit reassigns the port whenever a tunnel's region changes or it is
      # recreated -- all three moved when they were switched to chicago-illinois.
      # The SRV record _minecraft._tcp.phekno-oneblock.playit.plus is the source of
      # truth; players follow it automatically, this check does not.
      GATUS_TCP_ENDPOINT: phekno-oneblock.playit.plus:30972
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
