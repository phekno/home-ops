---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name minecraft-skyblock
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        RCON_PASSWORD: "{{ .RCON_PASSWORD }}"
  dataFrom:
    # Reuses the existing "minecraft" 1Password item so this deploys with no
    # manual secret setup. For a per-server RCON password, create a dedicated
    # item and change this key.
    - extract:
        key: minecraft
