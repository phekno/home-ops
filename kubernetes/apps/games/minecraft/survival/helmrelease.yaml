---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minecraft
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.2.0
  url: oci://ghcr.io/itzg/minecraft-server-charts/minecraft
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-survival
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  dependsOn: []
  interval: 15m
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.9.2@sha256:de5d1b1a83eba576f6c8a688fac2a3523ce457724cdebc8ea48d7818b74cdf6e
    resources:
      requests:
        cpu: 1000m
      limits:
        memory: 8Gi
    securityContext:
      runAsUser: 1000
      fsGroup: 100
    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 30
    startupProbe:
      enabled: true
    extraEnv:
      TZ: America/Chicago
    persistence:
      storageClass: longhorn
      dataDir:
        enabled: true
        Size: 10Gi
        existingClaim: minecraft-survival-datadir
    # The chart renders THIS top-level key onto the Minecraft service.
    # minecraftServer.serviceAnnotations is deprecated and silently ignored,
    # which is why the annotation below never took effect and Cilium handed out
    # a pool address instead. Set to .153 -- the address already in use -- so
    # declared and actual agree without moving a working server.
    serviceAnnotations:
      io.cilium/lb-ipam-ips: 10.100.50.153
      # gatus-sidecar watches annotated Services, so the check lives here
      # rather than in a ConfigMap. playit reassigns the port whenever a
      # tunnel's region changes, so this value has to be updated by hand --
      # players follow the SRV record and are not affected.
      #
      # A TCP connect only proves playit's edge is accepting. mc-monitor is
      # the real health signal; this catches DNS and tunnel-shaped failures
      # that are invisible from inside the cluster.
      gatus.home-operations.com/enabled: "true"
      gatus.home-operations.com/endpoint: |-
        name: minecraft-survival-tunnel
        group: external
        url: "tcp://phekno.playit.plus:30973"
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        ui:
          hide-hostname: true
      # mc-router.itzg.me/externalServerName: mc.phekno.io
    minecraftServer:
      eula: true
      # version: 1.21.1
      # type: FORGE
      overrideServerProperties: true
      jvmXXOpts: "-XX:MaxRAMPercentage=75"
      difficulty: normal
      spawnProtection: 0
      gameMode: survival
      pvp: false
      # onlineMode: https://kube-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
      ops: "phekno,quinnyf13"
      whitelist: "phekno,quinnyf13,harpyf13,LivParrot,abbykinz2013"
      motd: "Phekno's Survival Server"
      worldSaveName: phekno-survival
      viewDistance: 12
      modUrls: []
      rcon:
        enabled: true
      serviceType: LoadBalancer
  valuesFrom:
    - kind: Secret
      name: *app
      valuesKey: RCON_PASSWORD
      targetPath: minecraftServer.rcon.password
