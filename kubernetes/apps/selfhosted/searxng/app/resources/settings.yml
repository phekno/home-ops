---
# Only overrides live here; everything else is inherited so upgrades do not
# require reconciling a full copy of upstream's settings.yml.
use_default_settings: true
general:
  instance_name: "search.phekno.io"
  donation_url: false
  contact_url: false
server:
  # secret_key is injected by the SEARXNG_SECRET env var, which takes
  # precedence over anything set here.
  #
  # The limiter's bot detection needs a real client IP and rejects every
  # request with "Too Many Requests" when it cannot find one ("X-Forwarded-For
  # nor X-Real-IP header is set!"). It also wants a limiter.toml we do not
  # ship. Authelia already gates this instance, so the limiter only adds a
  # failure mode.
  limiter: false
  image_proxy: true
  method: "GET"
# Renamed upstream; `redis:` still works but logs a DeprecationWarning.
valkey:
  url: redis://dragonfly.db.svc.cluster.local:6379/1
search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json
engines:
  # Onion engines; they cannot load without a Tor proxy and log an error on
  # every worker start.
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
ui:
  default_theme: simple
  theme_args:
    simple_style: dark
