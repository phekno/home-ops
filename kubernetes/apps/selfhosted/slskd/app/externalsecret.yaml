---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: slskd-secret
    template:
      data:
        # Soulseek network account - register in the Nicotine+/SoulseekQt
        # client or at slsknet.org; slskd cannot create one for you.
        SLSKD_SLSK_USERNAME: "{{ .SLSKD_SLSK_USERNAME }}"
        SLSKD_SLSK_PASSWORD: "{{ .SLSKD_SLSK_PASSWORD }}"
        # Local web UI account, still enforced behind Authelia so the API
        # stays usable if you ever drop ext-auth.
        SLSKD_USERNAME: "{{ .SLSKD_USERNAME }}"
        SLSKD_PASSWORD: "{{ .SLSKD_PASSWORD }}"
  dataFrom:
    - extract:
        key: slskd
