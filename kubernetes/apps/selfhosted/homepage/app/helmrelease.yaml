---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
  namespace: selfhosted
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      homepage:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # homepage copies any missing config file out of its own skeleton on
          # startup, so /app/config has to be writable. The ConfigMap is staged
          # read-only and seeded into an emptyDir instead of being mounted
          # directly, which would make the whole directory read-only.
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - cp -f /config-src/*.yaml /app/config/
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.3.0
            env:
              TZ: "America/Chicago"
              HOMEPAGE_ALLOWED_HOSTS: homepage.phekno.io
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    # kubelet probes dial the pod IP, which is not in
                    # HOMEPAGE_ALLOWED_HOSTS and gets rejected. Sending the
                    # real Host satisfies validation without widening it.
                    httpHeaders:
                      - name: Host
                        value: homepage.phekno.io
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [namespaces, pods, nodes, services]
              verbs: [get, list]
            - apiGroups: [extensions, networking.k8s.io]
              resources: [ingresses]
              verbs: [get, list]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      homepage: {}
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames: ["homepage.phekno.io"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config-src:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /config-src
            readOnly: true
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config
      # Next.js writes its build cache at runtime, and the root fs is read-only.
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
