---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ntfy
  namespace: &namespace selfhosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No ext-auth: Authelia's redirect-to-login breaks the Android/iOS apps and
  # `curl -d` publishing, neither of which can follow an SSO flow. ntfy's own
  # user/ACL database guards it instead, with default access denied.
  components:
    - ../../../../components/gatus/external
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/selfhosted/ntfy/app
  postBuild:
    substitute:
      APP: *app
      GATUS_STATUS: "401"
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
