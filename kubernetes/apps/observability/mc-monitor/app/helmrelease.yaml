---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-monitor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      mc-monitor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/itzg/mc-monitor
              tag: 0.18.1
            args: ["export-for-prometheus"]
            env:
              # Cluster DNS rather than the LoadBalancer IPs: this is a
              # black-box check of the Minecraft protocol itself, and it works
              # for survival too, which runs vanilla and cannot take plugins.
              #
              # Deliberately NOT the playit hostnames. A status ping does not
              # survive the tunnel (mc-monitor gets EOF through it even while
              # players connect fine), so pointing here would report every
              # server permanently down. The playit path is covered separately
              # by the gatus TCP endpoints.
              EXPORT_SERVERS: minecraft-survival.games.svc.cluster.local:25565,minecraft-oneblock.games.svc.cluster.local:25565,minecraft-skyblock.games.svc.cluster.local:25565
              EXPORT_PORT: &port 8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
    service:
      app:
        controller: mc-monitor
        ports:
          http:
            port: *port
