---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unpoller-rules
spec:
  groups:
    - name: unifi-gateway.rules
      rules:
        - alert: UnifiGatewayHighCpu
          expr: |-
            max by (name) (unpoller_device_cpu_utilization_ratio{type="udm"}) > 0.7
          for: 1h
          labels:
            severity: warning
            device: udm
          annotations:
            summary: >-
              UniFi gateway {{ $labels.name }} CPU above 70% for 1h
              ({{ $value | humanizePercentage }})
            description: >-
              Sustained high CPU on the UDM is usually the Network app
              (/usr/lib/unifi/lib/unifi) stuck in GC with a full 512MB heap.
              Expect the UniFi API to slow down and unifi-dns to crashloop.
              Confirm with `top -H -p $(pgrep -f lib/unifi/lib/unifi)` on the
              UDM, then `systemctl restart unifi` (routing/Wi-Fi stay up).

        - alert: UnifiGatewayHighMemory
          expr: |-
            avg_over_time(max by (name) (unpoller_device_memory_utilization_ratio{type="udm"})[6h:5m]) > 0.68
          for: 30m
          labels:
            severity: warning
            device: udm
          annotations:
            summary: >-
              UniFi gateway {{ $labels.name }} memory averaging above 68% over 6h
              ({{ $value | humanizePercentage }})
            description: >-
              Normal 6h average is 58-66%. A sustained climb is usually
              unifi-core leaking (UniFi OS 5.1.33), which pushes the Network
              app into swap and GC thrash. Check `ps -o rss=,cmd= -C unifi-core`
              on the UDM (~200MB after boot) and `systemctl restart unifi-core`
              if it is bloated (routing/Wi-Fi stay up).
