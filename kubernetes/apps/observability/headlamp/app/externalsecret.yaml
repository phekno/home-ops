---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headlamp-secret
    template:
      data:
        HEADLAMP_CONFIG_OIDC_CLIENT_ID: "{{ .CLIENT_ID }}"
        HEADLAMP_CONFIG_OIDC_CLIENT_SECRET: "{{ .CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: headlamp
