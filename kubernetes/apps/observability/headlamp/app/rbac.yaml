---
# Headlamp passes each user's Pocket-ID token through to the API server, so
# access is decided per user here, not by Headlamp's ServiceAccount (which
# gets no bindings). Pocket-ID's `admins` group arrives as `oidc:admins`
# via the kube-apiserver oidc-groups-prefix in talos/patches/controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:admins
