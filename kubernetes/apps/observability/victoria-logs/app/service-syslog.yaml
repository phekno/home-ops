---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  annotations:
    lbipam.cilium.io/ips: 10.100.50.154
spec:
  type: LoadBalancer
  ports:
    - name: syslog-tcp
      port: 514
      protocol: TCP
      targetPort: 5514
    - name: syslog-udp
      port: 514
      protocol: UDP
      targetPort: 5514
  selector:
    app.kubernetes.io/name: victoria-logs-single
    app.kubernetes.io/instance: victoria-logs
    app: server
