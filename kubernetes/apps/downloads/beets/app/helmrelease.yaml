---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app beets
  namespace: downloads
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      # The only thing that runs beets. It owns the ReadWriteOnce library
      # volume, so nothing else can contend for it - the jobs below just ask it
      # to do work over HTTP.
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/beets
              tag: 2.14.0
            # s6-overlay would otherwise start the beets web UI and never exit.
            command: ["/usr/bin/python3", "/worker/worker.py"]
            env:
              TZ: "America/Chicago"
              BEETSDIR: /config
              WORKER_PORT: &port 8337
              SWEEP_MIN_AGE_SECONDS: "1800"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

      # Backstop for anything the webhook missed - a restart during a transfer,
      # or a folder dropped in by hand.
      sweep:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 1
          ttlSecondsAfterFinished: 3600
        containers:
          app: &caller
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - wget -q -O- --post-data='' http://beets.downloads.svc.cluster.local:8337/sweep
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

      # Whole-library normalisation, on demand:
      #   kubectl create job -n downloads --from=cronjob/beets-library <name>
      # No need to suspend anything first - the worker runs one import at a
      # time, so this simply queues behind whatever is in flight.
      library:
        type: cronjob
        cronjob:
          suspend: true
          schedule: "0 5 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 0
        containers:
          app:
            <<: *caller
            command:
              - sh
              - -c
              - wget -q -O- --post-data='' http://beets.downloads.svc.cluster.local:8337/library
    service:
      worker:
        controller: worker
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: beets
        advancedMounts:
          worker:
            app:
              - path: /config
      config-file:
        type: configMap
        name: beets-config
        advancedMounts:
          worker:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      worker-script:
        type: configMap
        name: beets-worker
        defaultMode: 0555
        advancedMounts:
          worker:
            app:
              - path: /worker
                readOnly: true
      music:
        type: nfs
        server: 10.100.50.10
        path: /tank/music
        advancedMounts:
          worker:
            app:
              - path: /music
