---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:${POSTGRESQL_VERSION}
  primaryUpdateStrategy: unsupervised
  # Rolling updates touch the primary last. CNPG defaults primaryUpdateMethod to
  # "restart", which stops Postgres in place and brings it back on the same pod,
  # so writes fail for as long as that takes -- roughly 90 seconds when the
  # anti-affinity change rolled through. "switchover" instead promotes an
  # already-updated replica and demotes the old primary, so the outage is the
  # switchover itself rather than a full restart.
  #
  # Safe here because nothing is pinned to an instance: all four consumers
  # connect through postgres-rw.db.svc.cluster.local, and that service follows
  # whichever instance is primary. Sessions are still dropped at the switchover,
  # so clients need to reconnect -- it shortens the interruption rather than
  # removing it.
  primaryUpdateMethod: switchover
  affinity:
    # CNPG defaults podAntiAffinityType to "preferred", which only asks the
    # scheduler to spread instances. During the Talos rolling reboots the
    # instances drifted until the primary and a replica shared one node, so a
    # single node failure would have taken out two of three. With three
    # instances on three nodes there is no reason to allow co-location:
    # "required" pins one instance per node.
    #
    # The trade-off is deliberate. While a node is down its instance stays
    # Pending instead of doubling up elsewhere, so maintenance runs with two
    # instances rather than three crowded onto two nodes. That is the safer
    # failure mode for a database -- and if a node is lost for good, the third
    # instance waits until it returns or the cluster is scaled down.
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: longhorn
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
  resources:
    requests:
      cpu: 500m
    limits:
      # hugepages-2Mi: 2Gi # Requires sysctl set on the host
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 15d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://phekno-home-k8s-pg/
      # endpointURL: https://ba20be062ff7623f9d887afa37183c8f.r2.cloudflarestorage.com
      # Note: serverName version needs to be inclemented
      # when recovering from an existing cnpg cluster
      serverName: postgres-v1
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cloudnative-pg-secret
          key: AWS_SECRET_ACCESS_KEY
  # # Note: previousCluster needs to be set to the name of the previous
  # # cluster when recovering from an existing cnpg cluster
  # bootstrap:
  #   recovery:
  #     source: &previousCluster postgres-v20
  # # Note: externalClusters is needed when recovering from an existing cnpg cluster
  # externalClusters:
  #   - name: *previousCluster
  #     barmanObjectStore:
  #       <<: *barmanObjectStore
  #       serverName: *previousCluster
