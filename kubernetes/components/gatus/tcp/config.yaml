# A raw TCP check, for services that do not speak HTTP.
#
# Set GATUS_TCP_ENDPOINT to a host:port in the app's ks.yaml substitutions.
#
# This proves DNS resolves and something is accepting connections at that
# address. For a service behind a proxy or tunnel, the proxy's edge may accept
# the connection on the backend's behalf, so treat a pass as "the front door is
# reachable" rather than "the service is healthy". Pair it with a protocol-aware
# check where one exists.
endpoints:
  - name: "${APP}"
    group: ${GATUS_TCP_GROUP:=tcp}
    url: "tcp://${GATUS_TCP_ENDPOINT}"
    interval: 1m
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[CONNECTED] == true"
