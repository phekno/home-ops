---
# yamllint configuration for home-ops
extends: default

rules:
  line-length: disable
  braces:
    # repo style is `{ key: value }`; also allow `{}`
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    # both indented and non-indented sequences appear; require consistency per file
    indent-sequences: consistent
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']

ignore: |
  # Vendored upstream CRD - not ours to reformat
  kubernetes/apps/db/dragonfly/app/crd.yaml
  # SOPS-encrypted; formatting is owned by sops
  *.sops.yaml
  # Generated by talhelper (gitignored)
  talos/clusterconfig/
