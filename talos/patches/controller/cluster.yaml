cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    # PodSecurity admission is ACTIVE, enforcing the baseline level and exempting
    # only kube-system -- that is Talos's default and it is not overridden here.
    # An `admissionControl: []` line used to sit here claiming to disable it, but
    # an empty list does not clear a default in a strategic merge, so it was a
    # no-op; genconfig emits the stock PodSecurity plugin either way. Namespaces
    # needing privileged pods carry pod-security.kubernetes.io labels instead
    # (see kubernetes/apps/{longhorn-system,observability}/kustomization.yaml),
    # which need no machine config change and survive config drift.
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      # Pocket-ID logins for Headlamp. Tokens are validated against the
      # issuer's JWKS; SA tokens and the admin kubeconfig are unaffected.
      # The oidc: prefixes keep OIDC users/groups from colliding with
      # built-in names (system:*, admins bound elsewhere).
      oidc-issuer-url: https://id.phekno.io
      oidc-client-id: 4eb66c8c-c78d-4786-8f82-09b5da66f6f7
      oidc-username-claim: email
      oidc-username-prefix: "oidc:"
      oidc-groups-claim: groups
      oidc-groups-prefix: "oidc:"
      oidc-signing-algs: RS256
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.100.50.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
