# k8s-2 -- control plane. Passed to `talosctl gen config` as a config patch
# after the global and controller patches (see scripts/talos-genconfig.sh).
# The address on the LinkConfig below is how the talos:* tasks map IP= to
# this file, so keep it as the node's primary address.
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: k8s-2
---
# Match the NIC by MAC so the config survives interface renames.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("bc:24:11:cd:94:29", mac(link.hardware_addr))
---
# Shared control plane VIP (clusterEndpoint in talenv.yaml).
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.100.50.150
link: ethSel0
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 10.100.50.49/24
routes:
  - gateway: 10.100.50.1
